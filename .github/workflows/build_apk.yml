name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36
        pip install --upgrade buildozer

    - name: Prepare App Code
      run: |
        mkdir -p my_app
        echo "${{ github.event.client_payload.code }}" > my_app/main.py

    - name: Init Buildozer Spec & Force NDK 25b
      run: |
        cd my_app
        buildozer init -y
        
        # הגדרות תאימות, API וגרסת NDK 25b
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/#android.api = 33/android.api = 33/' buildozer.spec
        sed -i 's/#android.minapi = 21/android.minapi = 21/' buildozer.spec
        
        # כפיית שימוש ב-NDK 25b ואישור רישיונות אוטומטי
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec

    - name: Force Download Correct NDK r25b
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        cd /home/runner/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        mv android-ndk-r25b android-ndk-r28c || true

    - name: Build with Buildozer
      run: |
        cd my_app
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: my_app/bin/*.apk
