name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare App Code
      run: |
        mkdir -p my_app
        echo "${{ github.event.client_payload.code }}" > my_app/main.py

    - name: Initialize Buildozer and Configure Spec
      run: |
        cd my_app
        buildozer init -y
        
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec

    - name: Build APK inside Docker Container
      run: |
        cd my_app
        export HOME=/root
        # עקיפת בדיקת המשתמש כדי שלא ימתין לקלט מהמשתמש
        export Buildozer_allow_root=1
        yes y | buildozer -v android debug || buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: my_app/bin/*.apk
